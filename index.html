<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Proxy Portal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Navigation Bar */
    header {
      background-color: #1e293b;
      padding: 12px 16px;
      display: flex;
      gap: 12px;
      align-items: center;
      border-bottom: 1px solid #334155;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      z-index: 10;
    }

    .nav-btn {
      background: #334155;
      border: none;
      color: #f8fafc;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }

    .nav-btn:hover {
      background: #475569;
    }

    .url-form {
      display: flex;
      flex: 1;
      gap: 8px;
    }

    .url-input {
      flex: 1;
      background: #0f172a;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .url-input:focus {
      border-color: #3b82f6;
    }

    .go-btn {
      background: #2563eb;
      border: none;
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .go-btn:hover {
      background: #1d4ed8;
    }

    /* Settings Section */
    .settings-bar {
      background: #182234;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      color: #94a3b8;
      border-bottom: 1px solid #334155;
    }

    .settings-bar input {
      background: #0f172a;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      width: 320px;
    }

    /* Main Content Area */
    main {
      flex: 1;
      position: relative;
      background: #0f172a;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #ffffff;
    }

    /* Placeholder Welcome Screen */
    .welcome-screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      background: #0f172a;
      z-index: 2;
    }

    .welcome-screen h1 {
      font-size: 2rem;
      margin-bottom: 12px;
      color: #38bdf8;
    }

    .welcome-screen p {
      color: #94a3b8;
      max-width: 500px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <header>
    <button class="nav-btn" onclick="reloadFrame()" title="Reload">↻</button>
    <form class="url-form" id="proxy-form">
      <input 
        type="text" 
        id="url-input" 
        class="url-input" 
        placeholder="Enter URL (e.g. example.com)..." 
        required 
      />
      <button type="submit" class="go-btn">Go</button>
    </form>
  </header>

  <div class="settings-bar">
    <label for="proxy-endpoint">Proxy Endpoint:</label>
    <input 
      type="text" 
      id="proxy-endpoint" 
      value="https://proxy.julian-grohmann6.workers.dev/?url=" 
      placeholder="https://your-backend.com/proxy?url=" 
    />
  </div>

  <main>
    <div id="welcome" class="welcome-screen">
      <h1>Web Proxy Portal</h1>
      <p>Enter a URL in the address bar above to browse through your backend proxy worker.</p>
    </div>
    <iframe id="proxy-frame" style="display: none;"></iframe>
  </main>

  <script>
    const form = document.getElementById('proxy-form');
    const urlInput = document.getElementById('url-input');
    const proxyEndpointInput = document.getElementById('proxy-endpoint');
    const iframe = document.getElementById('proxy-frame');
    const welcome = document.getElementById('welcome');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      let targetUrl = urlInput.value.trim();

      if (!targetUrl) return;

      // Ensure URL protocol
      if (!/^https?:\/\//i.test(targetUrl)) {
        targetUrl = 'https://' + targetUrl;
      }

      const proxyEndpoint = proxyEndpointInput.value.trim();
      const fullProxyUrl = proxyEndpoint + encodeURIComponent(targetUrl);

      // Hide welcome screen and load iframe
      welcome.style.display = 'none';
      iframe.style.display = 'block';
      iframe.src = fullProxyUrl;
    });

    function reloadFrame() {
      if (iframe.src) {
        iframe.contentWindow.location.reload();
      }
    }
  </script>
</body>
</html>
